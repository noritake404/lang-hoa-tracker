<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lang Hoa • Tra cứu hoa</title>
<style>
:root{--bg:#fffaf1;--card:#fff;--ink:#2f2018;--muted:#8f7c73;--line:#eadfce;--accent:#e99a18}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:18px 15px 48px}header{text-align:center;padding:7px 0 18px}
h1{margin:0;font-size:27px}.sub{font-size:13px;color:var(--muted);margin-top:5px}
.search{position:sticky;top:0;z-index:5;padding:5px 0 10px;background:linear-gradient(var(--bg) 85%,transparent)}
input{width:100%;padding:16px 17px;border:1px solid #e9a118;border-radius:18px;background:white;font-size:17px;outline:none}
.chips{display:flex;gap:8px;overflow:auto;padding:0 0 10px}
.chip{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:999px;white-space:nowrap;font-size:14px}
.chip.active{background:#57463f;color:#fff;border-color:#57463f}
.meta{font-size:13px;color:var(--muted);padding:0 3px 9px}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 4px 14px #5c3d200b}
.art{width:100%;height:190px;background:#faf7f2;display:flex;align-items:center;justify-content:center;overflow:hidden}
.art img{width:100%;height:100%;object-fit:contain;display:block}
.body{padding:14px 15px 15px}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.flower{font-weight:760;font-size:17px;line-height:1.3}.badge{font-size:12px;font-weight:750;border-radius:999px;padding:5px 9px;white-space:nowrap}
.Tím{background:#eee5ff;color:#6f4ab3}.Cam{background:#fff0d7;color:#ae6500}.Đỏ{background:#ffe1e5;color:#ac3043}.Lam{background:#e5f4ff;color:#32729f}
.memberTitle{font-size:12px;color:var(--muted);margin-top:12px}.members{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.member{font-size:13px;padding:7px 9px;background:#f7f1e8;border-radius:10px}
.empty{text-align:center;color:var(--muted);padding:42px 10px}footer{text-align:center;font-size:11px;color:#aa968c;margin-top:25px}
@media(min-width:650px){.cards{grid-template-columns:1fr 1fr}.art{height:215px}}
</style></head>

</main>
