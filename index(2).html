<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lang Hoa • Tra cứu hoa</title>
<style>
:root{--bg:#fffaf1;--card:#fff;--ink:#493a35;--muted:#8f7c73;--line:#eadfce;--accent:#e99a18}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:720px;margin:auto;padding:18px 15px 50px}.hero{text-align:center;padding:7px 0 13px}
h1{margin:0;font-size:26px}.sub{font-size:13px;color:var(--muted);margin-top:5px}
.search{position:sticky;top:0;z-index:4;padding:9px 0 4px;background:linear-gradient(var(--bg) 84%,transparent)}
input{width:100%;padding:16px 17px;border:1px solid var(--line);border-radius:17px;background:#fff;font-size:17px;outline:none;box-shadow:0 5px 18px #60441412}
input:focus{border-color:#d8b166}.chips{display:flex;gap:8px;overflow:auto;padding:10px 0 13px}
.chip{border:1px solid var(--line);background:#fff;padding:8px 13px;border-radius:999px;white-space:nowrap;color:var(--ink)}
.chip.active{background:#57463f;color:#fff;border-color:#57463f}.meta{font-size:13px;color:var(--muted);padding:0 2px 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin:9px 0;box-shadow:0 4px 14px #5c3d200b}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.flower{font-weight:750;font-size:17px;line-height:1.3}
.badge{font-size:12px;font-weight:750;border-radius:999px;padding:5px 9px;white-space:nowrap}
.Tím{background:#eee5ff;color:#6f4ab3}.Cam{background:#fff0d7;color:#ae6500}.Đỏ{background:#ffe1e5;color:#ac3043}
.memberTitle{font-size:12px;color:var(--muted);margin-top:12px}.members{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.member{font-size:13px;padding:7px 9px;background:#f7f1e8;border-radius:10px}.empty{text-align:center;color:var(--muted);padding:42px 10px}
footer{text-align:center;font-size:11px;color:#aa968c;margin-top:25px}
@media(min-width:650px){.wrap{padding-top:28px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{margin:0}}
</style></head>

<header class="hero"><h1>🌸 Lang Hoa</h1><div class="sub">Tra cứu nhanh ai đang có hoa cho nhiệm vụ Guide</div></header>

<button class="chip" data-grade="Cam">🟠 Cam</button>
<button class="chip" data-grade="Tím">🟣 Tím</button>
</div>
<div class="meta" id="meta"></div><section class="cards" id="cards"></section>
<footer>Prototype • dữ liệu đã cleanse từ 5 thành viên • chỉ Tím / Cam / Đỏ</footer>

const matchesSearch=(flower,query)=>{
 const q=clean(query);
 if(!q)return true;
 // If the user types Vietnamese marks, respect them exactly (e.g. “én” won't match “Diên”).
 // If they type without marks, search the accent-normalized name (e.g. “moc lan” matches “Mộc Lan”).
 return hasVietnameseMarks(q) ? clean(flower).includes(q) : norm(flower).includes(norm(q));
};

}
function render(){
